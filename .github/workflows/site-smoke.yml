name: CI - exploratory site test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  exploratory-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Validate JavaScript
        run: node --check js/main.js

      - name: Run application smoke test
        run: node scripts/smoke-test.js

      - name: Run exploratory browser test
        run: |
          node scripts/serve.js > server.log 2>&1 &
          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:8000 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000 > /dev/null || (cat server.log && exit 1)
          SITE_URL=http://127.0.0.1:8000 node scripts/exploratory-test.js

      - name: Upload exploratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-test-evidence
          path: |
            artifacts/
            server.log
          if-no-files-found: warn
