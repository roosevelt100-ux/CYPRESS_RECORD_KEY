<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greicin | Produtos</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:1100px;margin:auto;padding:120px 6vw}.box{border:1px solid #ddd5ca;padding:25px;margin:25px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}input,select,textarea{padding:12px;border:1px solid #ddd5ca;background:#faf8f5}.preview{height:150px;border:1px dashed #ddd5ca;display:flex;align-items:center;justify-content:center}.preview img{max-width:100%;max-height:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #ddd5ca}.card img,.ph{width:100%;height:140px;object-fit:cover}.ph{display:flex;align-items:center;justify-content:center;background:#ddd5ca}.body{padding:15px}.actions{display:flex;gap:10px}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}.full{grid-column:auto}}</style><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/Greicin logo sem fundo.png"></a><a href="index.html">← Site</a></header><main><p class="eyebrow">CATÁLOGO</p><h1>Área de Produtos</h1><p>Cadastre, edite, exclua e suba fotos dos brindes. Os dados ficam neste navegador.</p><section class="box"><h2 id="title">Adicionar brinde</h2><form id="form" class="grid"><input type="hidden" id="edit"><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>Categoria</label><select id="cat"><option value="madeira">Madeira</option><option value="offwhite">Off-White</option><option value="preto">Preto Velvet</option></select></div><div class="field"><label>Etiqueta</label><input id="tag"></div><div class="field"><label>Foto</label><input id="file" type="file" accept="image/*"></div><div class="field full"><label>Descrição</label><textarea id="desc"></textarea></div><div class="preview full" id="preview">Prévia da imagem</div><div class="actions full"><button class="btn btn-primary">Salvar produto</button><button class="btn" type="button" onclick="resetForm()">Limpar</button></div></form></section><section class="box"><h2>WhatsApp comercial</h2><input id="wa" placeholder="5511999999999"><button class="btn btn-primary" onclick="saveWA()">Salvar</button></section><section class="box"><h2>Produtos cadastrados</h2><div id="cards" class="cards"></div></section></main><script>
const KEY='greicin_products_v2',SET='greicin_settings_v2';let img='';const defaults=['Porta-Cartões Escultórico','Bandeja de Bolhas · M','Lixeira de Mesa Ondulada','Gaveteiro Modular Canelado','Organizador Geométrico','Kit Unificado Presidente'].map((name,i)=>({id:i+1,name,cat:i<2?'madeira':i<4?'offwhite':'preto',tag:i<2?'Madeira Premium':i<4?'Off-White':'Preto Velvet',desc:'Brinde corporativo personalizado.',img:''}));let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){cards.innerHTML='';data.forEach(p=>{let c=document.createElement('div');c.className='card';c.innerHTML=(p.img?'<img src="'+p.img+'">':'<div class="ph">'+p.name+'</div>')+'<div class="body"><h3>'+p.name+'</h3><small>'+p.tag+'</small><p>'+p.desc+'</p><div class="actions"><button class="btn edit">Editar</button><button class="btn del">Excluir</button></div></div>';c.querySelector('.edit').onclick=()=>editProduct(p);c.querySelector('.del').onclick=()=>{if(confirm('Excluir produto?')){data=data.filter(x=>x.id!==p.id);save();render()}};cards.appendChild(c)})}file.onchange=()=>{let r=new FileReader();r.onload=()=>{img=r.result;preview.innerHTML='<img src="'+img+'">'};r.readAsDataURL(file.files[0])};form.onsubmit=e=>{e.preventDefault();let id=Number(edit.value)||Date.now(),old=data.find(x=>x.id===id),p={id,name:name.value,cat:cat.value,tag:tag.value||cat.value,desc:desc.value,img:img||(old?old.img:'')},i=data.findIndex(x=>x.id===id);i<0?data.push(p):data[i]=p;save();resetForm();render();alert('Produto salvo!')};function editProduct(p){edit.value=p.id;name.value=p.name;cat.value=p.cat;tag.value=p.tag;desc.value=p.desc;img=p.img||'';preview.innerHTML=img?'<img src="'+img+'">':'Prévia da imagem';title.textContent='Editar brinde'}function resetForm(){form.reset();edit.value='';img='';preview.textContent='Prévia da imagem';title.textContent='Adicionar brinde'}function saveWA(){localStorage.setItem(SET,JSON.stringify({whatsapp:wa.value}));alert('WhatsApp salvo!')}wa.value=(JSON.parse(localStorage.getItem(SET)||'{}').whatsapp)||'';render();
</script></body></html>
